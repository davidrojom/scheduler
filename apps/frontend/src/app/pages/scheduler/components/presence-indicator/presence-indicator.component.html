@if (members$ | async; as members) {
@if (members.length) {
<div
  class="flex items-center gap-1.5"
  title="Collaborators on this board"
  data-testid="presence-indicator"
>
  <div class="flex -space-x-2">
    @for (member of members; track member.userId) {
    <button
      type="button"
      class="w-8 h-8 rounded-full grid place-items-center text-sm font-bold text-white uppercase ring-2 transition-all cursor-pointer disabled:cursor-default disabled:opacity-90"
      [class.ring-primary]="isFollowed(member)"
      [class.ring-background]="!isFollowed(member)"
      [class.scale-110]="isFollowed(member)"
      [style.background-color]="member.color"
      [attr.data-user-id]="member.userId"
      [attr.aria-pressed]="isFollowed(member)"
      [attr.aria-label]="avatarTitle(member)"
      [disabled]="member.userId === selfId"
      [title]="avatarTitle(member)"
      (click)="toggleFollow(member)"
    >
      {{ initial(member) }}
    </button>
    }
  </div>
  <span
    class="hidden md:block text-sm text-muted-foreground font-medium ml-1"
    data-testid="presence-count"
  >
    {{ members.length }}
  </span>
</div>
}
}
